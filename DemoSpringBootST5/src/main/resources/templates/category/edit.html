<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Sửa Category</title>
</head>
<body>
<div layout:fragment="content">
    <h2>Sửa Category</h2>

    <form th:action="@{/categories/edit}" th:object="${category}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label for="name" class="form-label">Tên Category:</label>
            <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Nhập tên category" required/>
        </div>

        <button type="submit" class="btn btn-primary">Cập nhật</button>
        <a th:href="@{/categories}" class="btn btn-secondary">Quay lại</a>
    </form>
</div>
</body>
</html>
